<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1280, initial-scale=1">
<title>Echo — Narrative · Use of funds</title>
<link rel="stylesheet" href="v2.css">
<style>
h1{font-size:50px}
.flow{margin-top:64px;display:flex;align-items:center}
.stg{position:relative;flex:1;border-radius:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;
  border:1px solid rgba(160,172,255,.3);background:linear-gradient(180deg,rgba(120,135,255,.16),rgba(120,135,255,.04)),#0b0d15}
.stg b{font-size:56px;font-weight:700;letter-spacing:-.045em;line-height:1;
  background:linear-gradient(180deg,#fff 20%,#aeb9f5);-webkit-background-clip:text;background-clip:text;color:transparent}
.stg span{margin-top:8px;font-size:18px;font-weight:600;color:rgba(243,245,250,.86);white-space:nowrap}
.stg.first{flex:1.45;height:370px}
.stg.win{border-color:rgba(111,207,255,.55);background:linear-gradient(180deg,rgba(111,207,255,.22),rgba(111,207,255,.05)),#0b0d15;box-shadow:0 0 36px rgba(111,207,255,.2)}
.stg.win b{background:linear-gradient(180deg,#fff 20%,#9fdcff);-webkit-background-clip:text;background-clip:text}
.chev{position:relative;flex:none;width:40px;height:2px;background:linear-gradient(90deg,rgba(143,152,255,.3),#8f98ff)}
.chev::after{content:"";position:absolute;right:-1px;top:-5px;border:6px solid transparent;border-left:8px solid #8f98ff;border-right:0}
.chev.last{background:linear-gradient(90deg,#8f98ff,#6fcfff)}.chev.last::after{border-left-color:#6fcfff}
.lg9{margin-top:22px;display:grid;grid-template-columns:repeat(3,44px);gap:10px}
.lg9 i{width:44px;height:44px;border-radius:11px;background:#f7f7f2;display:flex;align-items:center;justify-content:center;overflow:hidden}
.lg9 img{width:38px;height:38px;object-fit:contain}
.stg .note{margin-top:12px;font-size:13.5px;font-weight:500;color:var(--muted)}

.closer{margin-top:auto}
.src{position:absolute;left:76px;right:76px;bottom:11px;display:flex;justify-content:space-between;font:500 9.5px var(--mono);color:var(--faint);letter-spacing:.03em}
</style>
</head>
<body>
<section class="slide">
  <div class="eyebrow"><span class="dot"></span><span class="brand">ECHO</span><span>第五幕 · 资金用途</span></div>
  <h1><em>400 万美元</em>用来加速销售：招驻场工程师。</h1>

  <div class="flow">
    <div class="stg first"><b>120</b><span>个目标客户</span><div class="lg9"><i><img src="assets/logos/openai.png" alt=""></i><i><img src="assets/logos/anthropic.png" alt=""></i><i><img src="assets/logos/salesforce.png" alt="" style="width:32px;height:32px"></i><i><img src="assets/logos/ramp.png" alt=""></i><i><img src="assets/logos/commure.png" alt=""></i><i><img src="assets/logos/gecko-robotics.png" alt=""></i><i><img src="assets/logos/lindy.png" alt=""></i><i><img src="assets/logos/runway.png" alt=""></i><i><img src="assets/logos/unlimit.png" alt=""></i></div><div class="note">已经在招人部署 agent</div></div>
    <div class="chev"></div>
    <div class="stg" style="height:270px"><b>15</b><span>次付费诊断</span></div>
    <div class="chev"></div>
    <div class="stg" style="height:210px"><b>8</b><span>个试点</span></div>
    <div class="chev last"></div>
    <div class="stg win" style="height:160px"><b>4–6</b><span>份年度合同</span></div>
  </div>

  <div class="closer"><div class="line-copy"><b>6 亿美元</b>是目标，不是天花板。</div></div>
  <div class="src"><span>漏斗：销售计划 · 招聘信号：FDE 与 agent 工作流岗位公开职位，2026 年 7–8 月</span><span>17</span></div>
</section>
</body>
</html>
