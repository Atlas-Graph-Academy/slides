<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1280, initial-scale=1">
<title>Echo — 直投版 · 第 12 页</title>
<style>
:root{
  --ink:#f3f5fa; --muted:rgba(219,224,238,.64); --faint:rgba(211,217,235,.42);
  --line:rgba(220,227,255,.075); --line-strong:rgba(220,227,255,.15);
  --blue:#5267ff; --blue-bright:#aeb9f5; --eyebrow:rgba(177,188,255,.78);
  --sans:"Avenir Next","Avenir","PingFang SC","Hiragino Sans GB","Helvetica Neue",sans-serif;
  --mono:"IBM Plex Mono","Menlo",monospace;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{background:#000;font-family:var(--sans);color:var(--ink);-webkit-font-smoothing:antialiased}
.slide{position:relative;width:1280px;height:720px;margin:0 auto;overflow:hidden;
  background:
    radial-gradient(ellipse 78% 48% at 50% -18%,rgba(69,88,255,.13),transparent 66%),
    radial-gradient(circle at 82% 22%,rgba(0,0,242,.13),transparent 28rem),
    linear-gradient(180deg,#050609 0%,#080a10 44%,#050609 100%);
  display:flex;flex-direction:column;padding:44px 76px 32px}
.slide::before{content:"";position:absolute;inset:0;opacity:.035;pointer-events:none;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.84' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.9'/%3E%3C/svg%3E")}
.slide>*{position:relative;z-index:1}
.eyebrow{display:flex;align-items:center;gap:10px;font:600 12px/1.2 var(--mono);letter-spacing:.18em;text-transform:uppercase;color:var(--eyebrow)}
.eyebrow .dot{width:6px;height:6px;border-radius:50%;background:#6075ff;box-shadow:0 0 0 4px rgba(82,103,255,.1),0 0 18px rgba(82,103,255,.62)}
.eyebrow .brand{color:var(--ink);font-weight:700;letter-spacing:.24em}
h1{margin-top:17px;font-size:52px;line-height:1.04;letter-spacing:-.028em;font-weight:600;white-space:nowrap}
h1 em{font-style:normal;color:var(--blue-bright)}
.sub{margin-top:8px;font-size:17px;line-height:1.35;color:var(--muted)}
.sub b{color:var(--ink);font-weight:600}
.main{flex:1;min-height:0;display:grid;grid-template-columns:292px 1fr;gap:34px;margin-top:20px}
.proof{position:relative;height:405px;border:1px solid var(--line-strong);overflow:hidden;background:#0b0d12}
.proof img{width:100%;height:100%;object-fit:cover;object-position:top;filter:saturate(.92) contrast(1.02)}
.proof::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 56%,rgba(5,6,9,.12) 64%,rgba(5,6,9,.74) 78%,rgba(5,6,9,.98) 91%)}
.proof-copy{position:absolute;z-index:2;left:17px;right:17px;bottom:15px}
.proof-copy .k{font:700 10px/1.3 var(--mono);letter-spacing:.15em;color:var(--blue-bright);text-transform:uppercase}
.proof-copy .n{margin-top:5px;font-size:20px;font-weight:600;letter-spacing:-.012em;color:var(--ink)}
.proof-brand{display:flex;align-items:center;gap:9px;margin-top:6px}
.proof-brand .n{margin-top:0}
.proof .proof-logo{width:31px;height:31px;flex:none;border-radius:8px;display:block;object-fit:contain;object-position:center;filter:none;box-shadow:0 4px 14px rgba(0,0,0,.28)}
.proof-copy .s{margin-top:5px;font:500 10.5px/1.45 var(--mono);letter-spacing:.018em;color:var(--muted)}
.roadmap{height:405px;position:relative;border-top:1px solid var(--line-strong)}
.roadmap svg{width:100%;height:100%;display:block;overflow:visible}
.guide{stroke:rgba(220,227,255,.08);stroke-width:1}
.path{fill:none;stroke:var(--blue-bright);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.point{fill:#080a10;stroke:var(--blue-bright);stroke-width:2.3}
.point-final{fill:var(--blue);stroke:#d4d9ff;stroke-width:2.4}
.halo{fill:rgba(82,103,255,.12);stroke:rgba(174,185,245,.5);stroke-width:1.4;stroke-dasharray:4 6}
.month{font:600 10px var(--mono);letter-spacing:.13em;fill:var(--faint)}
.seat{font:700 24px var(--sans);letter-spacing:-.02em;fill:var(--ink)}
.seat-final{font:700 29px var(--sans);letter-spacing:-.022em;fill:var(--ink)}
.note{font:600 10.5px var(--mono);letter-spacing:.04em;fill:var(--blue-bright)}
.note-muted{font:500 10px var(--mono);letter-spacing:.025em;fill:var(--muted)}
.valuation{font:700 52px var(--sans);letter-spacing:-.03em;fill:var(--ink)}
.valuation-sub{font:600 11px var(--mono);letter-spacing:.08em;fill:var(--blue-bright)}
.equation{position:absolute;right:4px;bottom:18px;font:600 11px/1.5 var(--mono);letter-spacing:.035em;color:var(--muted);text-align:right}
.equation b{color:var(--ink);font-weight:700}
.closer{display:flex;justify-content:space-between;align-items:baseline;border-top:1px solid var(--line-strong);padding-top:12px}
.closer .line-copy{font-size:18px;font-weight:500;color:var(--ink);letter-spacing:-.008em}
.closer .line-copy b{color:var(--blue-bright);font-weight:600}
.closer .foot{font:500 10.5px var(--mono);letter-spacing:.06em;color:var(--faint)}
@page{size:13.333in 7.5in;margin:0}
@media print{html,body{background:#000}.slide{margin:0}}
@media screen{.slide{box-shadow:0 10px 40px rgba(0,0,0,.6)}}
</style>
</head>
<body>
<section class="slide">
  <div class="eyebrow"><span class="dot"></span><span class="brand">ECHO</span><span>Agent Enablement · 从第一个集成到估值</span></div>
  <h1><em>1 万个付费席位</em>，就能把我们带到 $600M。</h1>
  <div class="sub"><b>Unlimit 的 CCO 公开喊话 CTO：开始跟 Echo 合作。</b>然后，我们把这套动作复制下去。</div>

  <div class="main">
    <figure class="proof">
      <img src="assets/unlimit-linkedin.png" alt="LinkedIn screenshot of Unlimit CCO publicly connecting Echo with Unlimit's CTO">
      <figcaption class="proof-copy">
        <div class="k">客户公开拉动</div>
        <div class="proof-brand"><img class="proof-logo" src="assets/logos/unlimit.png" alt="Unlimit logo"><div class="n">CCO 公开喊话 → CTO</div></div>
        <div class="s">「交给你们俩了。」<br>一句公开喊话：开始跟 Echo 干。</div>
      </figcaption>
    </figure>

    <div class="roadmap">
      <svg viewBox="0 0 802 405" role="img" aria-label="A single 18-month line from the Unlimit integration today to 1,500 seats at month 6, 5,000 seats at month 12, and 10,000 paid seats at month 18, supporting 10 million dollars in realized ARR and a 600 million dollar valuation at 60 times revenue.">
        <defs>
          <filter id="glow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
        </defs>
        <line x1="46" y1="326" x2="746" y2="326" class="guide"/>
        <path d="M58 306 C160 297 192 274 246 264 S394 223 454 196 S613 121 664 96" class="path"/>

        <circle cx="58" cy="306" r="7" class="point"/>
        <circle cx="246" cy="264" r="7" class="point"/>
        <circle cx="454" cy="196" r="7" class="point"/>
        <circle cx="664" cy="96" r="43" class="halo"/>
        <circle cx="664" cy="96" r="10" class="point-final" filter="url(#glow)"/>

        <text x="58" y="350" text-anchor="middle" class="month">今天</text>
        <text x="58" y="371" text-anchor="middle" class="note">UNLIMIT 集成</text>

        <text x="246" y="301" text-anchor="middle" class="seat">~1,500</text>
        <text x="246" y="323" text-anchor="middle" class="month">第 6 个月</text>

        <text x="454" y="168" text-anchor="middle" class="seat">~5,000</text>
        <text x="454" y="188" text-anchor="middle" class="month">第 12 个月</text>

        <text x="627" y="52" text-anchor="end" class="seat-final">~10,000 席位</text>
        <text x="627" y="72" text-anchor="end" class="month">第 18 个月</text>

        <text x="792" y="174" text-anchor="end" class="valuation">$600M</text>
        <text x="792" y="196" text-anchor="end" class="valuation-sub">估值 @ 60×</text>
        <text x="792" y="217" text-anchor="end" class="note-muted">$10M+ 实收 ARR</text>
      </svg>
      <div class="equation"><b>10,000 席位 × $100 / 月</b><br>$12M 名义 ARR · $10M+ 实收 ARR · 60× = $600M</div>
    </div>
  </div>

  <div class="closer">
    <div class="line-copy">Unlimit 是最先的 650 个席位。<b>那面 28 家公司墙，只是第一个楔子。</b></div>
    <div class="foot">echoknows.com · 12</div>
  </div>
</section>
</body>
</html>
