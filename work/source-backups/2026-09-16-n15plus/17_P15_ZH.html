<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>Echo — 直投版 · 第 15 页</title>
<style>
:root{
  --ink:#f3f5fa;--muted:rgba(219,224,238,.62);--faint:rgba(211,217,235,.38);
  --line:rgba(220,227,255,.13);--blue-bright:#aeb9f5;--eyebrow:rgba(177,188,255,.78);
  --sans:"Avenir Next","Avenir","PingFang SC","Hiragino Sans GB","Helvetica Neue",sans-serif;
  --mono:"IBM Plex Mono","Menlo",monospace;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{background:#000;font-family:var(--sans);color:var(--ink);-webkit-font-smoothing:antialiased}
.slide{position:relative;width:1280px;height:720px;margin:24px auto;overflow:hidden;
  background:radial-gradient(ellipse 76% 48% at 50% -18%,rgba(69,88,255,.15),transparent 66%),
    radial-gradient(circle at 84% 72%,rgba(0,0,242,.14),transparent 31rem),
    linear-gradient(180deg,#050609 0%,#080a10 48%,#050609 100%);
  display:flex;flex-direction:column;padding:48px 76px 34px}
.slide::before{content:"";position:absolute;inset:0;opacity:.035;pointer-events:none;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.84' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.9'/%3E%3C/svg%3E")}
.slide>*{position:relative;z-index:1}
.eyebrow{display:flex;align-items:center;gap:10px;font:600 12px/1.2 var(--mono);letter-spacing:.18em;text-transform:uppercase;color:var(--eyebrow)}
.eyebrow .dot{width:6px;height:6px;border-radius:50%;background:#6075ff;box-shadow:0 0 0 4px rgba(82,103,255,.1),0 0 18px rgba(82,103,255,.62)}
.eyebrow .brand{color:var(--ink);font-weight:700;letter-spacing:.24em}
.ask-row{margin-top:37px;display:flex;align-items:flex-end;justify-content:space-between;gap:48px}
.ask{font-size:86px;line-height:.94;font-weight:600;letter-spacing:-.055em;white-space:nowrap}
.ask em{font-style:normal;color:var(--blue-bright)}
.close{flex:none;text-align:right;padding-bottom:8px}
.close .k{font:600 11px/1.2 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--eyebrow)}
.close .v{margin-top:8px;font-size:31px;line-height:1;font-weight:600;color:var(--ink);letter-spacing:-.025em}
.target{margin-top:54px}
.target .k{font:600 11px/1.2 var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--eyebrow)}
.target-line{margin-top:13px;display:flex;align-items:baseline;gap:18px;font-size:45px;line-height:1.05;font-weight:600;letter-spacing:-.035em;white-space:nowrap}
.target-line .arrow{color:rgba(174,185,245,.48);font-weight:400}
.target-line .arr,.target-line .valuation{color:var(--blue-bright)}
.comps{margin-top:52px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:17px 0 18px}
.comps .k{font:600 10.5px/1.2 var(--mono);letter-spacing:.15em;text-transform:uppercase;color:var(--eyebrow)}
.comp-line{margin-top:11px;display:flex;align-items:baseline;justify-content:space-between;gap:20px;font-size:17px;color:var(--muted);white-space:nowrap}
.comp-line b{color:var(--ink);font-weight:600}.comp-line .echo{color:var(--blue-bright)}
.contact{margin-top:auto}
.contact .k{font:600 11px/1.2 var(--mono);letter-spacing:.17em;text-transform:uppercase;color:var(--eyebrow)}
.email{margin-top:10px;font:600 50px/1.05 var(--mono);letter-spacing:-.025em;color:var(--ink)}
.foot{position:absolute;right:76px;bottom:38px;font:500 10.5px/1.2 var(--mono);letter-spacing:.08em;color:var(--faint)}
@page{size:13.333in 7.5in;margin:0}
@media print{html,body{background:#000}.slide{margin:0}}
@media screen{.slide{box-shadow:0 10px 40px rgba(0,0,0,.6)}}
</style>
</head>
<body>
<section class="slide">
  <div class="eyebrow"><span class="dot"></span><span class="brand">ECHO</span><span>种子轮 · 正在开放</span></div>
  <div class="ask-row">
    <div class="ask">募集 <em>$4M SAFE</em></div>
    <div class="close"><div class="k">计划完成本轮</div><div class="v">2026 年 9 月 30 日</div></div>
  </div>
  <div class="target">
    <div class="k">18 个月目标</div>
    <div class="target-line"><span>10,000 个付费席位</span><span class="arrow">→</span><span class="arr">$10M+ ARR</span><span class="arrow">→</span><span class="valuation">$600M</span></div>
  </div>
  <div class="comps">
    <div class="k">估值参照</div>
    <div class="comp-line"><span>mem0 <b>~$130M</b></span><span>Limitless <b>$350M</b></span><span>Engram <b>$600M</b></span><span>Granola <b>$1.5B</b></span><span>Glean <b>$7.2B</b></span><span class="echo">Echo 目标 <b>$600M</b></span></div>
  </div>
  <div class="contact"><div class="k">联系</div><div class="email">kobe@iditor.com</div></div>
  <div class="foot">echoknows.com · 15</div>
</section>
</body>
</html>
