<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1280, initial-scale=1">
<title>Echo — Narrative · Seed round</title>
<link rel="stylesheet" href="v2.css">
<style>
h1{font-size:64px}
.ask{margin-top:52px;display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.tile{padding:18px 20px;border-radius:16px;border:1px solid var(--line-strong);background:linear-gradient(180deg,rgba(255,255,255,.035),rgba(255,255,255,.01)),#0a0c12;display:flex;align-items:center;gap:14px}
.tile .ic{width:44px;height:44px;flex:none;border-radius:12px;display:flex;align-items:center;justify-content:center;background:rgba(120,135,255,.12);border:1px solid rgba(160,172,255,.26)}
.tile .ic svg{width:22px;height:22px;fill:none;stroke:#b8c1ff;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.tile b{display:block;font-size:24px;font-weight:700;letter-spacing:-.02em;white-space:nowrap}
.tile span{display:block;font-size:14px;color:var(--muted)}
.tile.hi{border-color:rgba(160,172,255,.4);background:linear-gradient(180deg,rgba(120,135,255,.16),rgba(120,135,255,.04)),#0b0d15}

.path{margin-top:56px;display:flex;align-items:center;gap:22px}
.path b{font-size:40px;font-weight:700;letter-spacing:-.035em;white-space:nowrap}
.path b.v{background:linear-gradient(180deg,#fff 20%,#aeb9f5);-webkit-background-clip:text;background-clip:text;color:transparent}
.path i{font-style:normal;font-size:28px;color:var(--faint)}
.path small{margin-left:auto;font:600 11px var(--mono);letter-spacing:.14em;color:var(--blue-bright)}

.comps{margin-top:48px;padding-top:30px;border-top:1px solid var(--line);display:flex;align-items:flex-end;justify-content:space-between}
.cp{display:flex;align-items:center;gap:9px}
.cp img{width:32px;height:32px;object-fit:contain;border-radius:8px}
.cp b{display:block;font-size:17px;font-weight:700;letter-spacing:-.02em}
.cp span{display:block;font-size:13px;color:var(--muted)}
.cp.me .orb{width:34px;height:34px;border-radius:50%;background:radial-gradient(circle at 38% 32%,#dff7ff 0%,#6fd3ff 38%,#2f8dff 100%);box-shadow:0 0 18px rgba(80,160,255,.55)}
.cp.me b{color:#c4ccff}

.contact{margin-top:auto;display:flex;align-items:baseline;justify-content:space-between;border-top:1px solid var(--line-strong);padding-top:14px}
.contact b{font:600 34px var(--mono);letter-spacing:-.01em}
.contact span{font:500 11px var(--mono);letter-spacing:.06em;color:var(--faint)}
</style>
</head>
<body>
<section class="slide">
  <div class="eyebrow"><span class="dot"></span><span class="brand">ECHO</span><span>种子轮 · 正在开放</span></div>
  <h1>本轮募集 <em>400 万美元 SAFE。</em></h1>

  <div class="ask">
    <div class="tile hi"><span class="ic"><svg viewBox="0 0 24 24"><path d="M6 3h9l4 4v14H6z"/><path d="M9 13l2.2 2.2L15.5 11"/></svg></span><div><b>签下 2 家 · 3 家在谈</b><span>创始人亲自卖了 3 周</span></div></div>
    <div class="tile"><span class="ic"><svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 0 1-14 5.3M4 12A8 8 0 0 1 18 6.7"/><path d="M18 3v4h-4M6 21v-4h4"/></svg></span><div><b>滚动交割</b><span>随时可以加入</span></div></div>
    <div class="tile"><span class="ic"><svg viewBox="0 0 24 24"><circle cx="8" cy="8" r="3"/><circle cx="16" cy="8" r="3"/><path d="M2 19c0-3 2.7-5 6-5s6 2 6 5M14 14c3.3 0 6 2 6 5"/></svg></span><div><b>加速销售</b><span>招驻场部署工程师</span></div></div>
  </div>

  <div class="path">
    <b>1 万个付费席位</b><i>→</i><b class="v">$10M+ ARR</b><i>→</i><b class="v">$600M</b>
    <small>18 个月内</small>
  </div>

  <div class="comps">
    <div class="cp"><img src="deck_assets/comps/sageox.ai.png" alt=""><div><b>$60M</b><span>SageOx</span></div></div>
    <div class="cp"><img src="deck_assets/comps/mastra.ai.png" alt=""><div><b>~$110M</b><span>Mastra</span></div></div>
    <div class="cp"><img src="deck_assets/direct/mem0.ai.png" alt=""><div><b>~$130M</b><span>Mem0</span></div></div>
    <div class="cp"><img src="deck_assets/direct/dust.tt.png" alt=""><div><b>~$250M</b><span>Dust</span></div></div>
    <div class="cp"><img src="deck_assets/comps/engram.com.png" alt=""><div><b>$600M</b><span>Engram</span></div></div>
    <div class="cp"><img src="deck_assets/direct/granola.ai.png" alt=""><div><b>$1.5B</b><span>Granola</span></div></div>
    <div class="cp"><img src="deck_assets/direct/glean.com.png" alt=""><div><b>$7.2B</b><span>Glean</span></div></div>
    <div class="cp me"><span class="orb"></span><div><b>$600M</b><span>Echo 目标</span></div></div>
  </div>

  <div class="contact"><b>kobe@iditor.com</b><span>~ 为按最近一轮融资估算 · echoknows.com · 21</span></div>
</section>
</body>
</html>
