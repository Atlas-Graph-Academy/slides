function esc(v){return String(v).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function S(a,b){return 'M'+a.x+' '+a.y+' C '+(a.x+(b.x-a.x)*.5)+' '+a.y+', '+(a.x+(b.x-a.x)*.5)+' '+b.y+', '+b.x+' '+b.y}
function labelPos(n){if(n.k==="ghost")return "right";if(n.id==="33")return "upright";if(n.id==="33.9")return "upleft";if(n.id==="33.9a")return "right";if(/[a-z]$/.test(n.id))return "up";return "down"}
function render(){
  var svg='',html='';
  html+='<span class="lane" style="top:'+LANE.ghost+'px">引用<b>其他工作流</b></span>'+
        '<span class="lane" style="top:'+LANE.branch+'px">分支 · 字母<b>33.8a</b></span>'+
        '<span class="lane" style="top:'+LANE.seq+'px">序列 · 点<b>33.8</b></span>'+
        '<span class="lane" style="top:'+LANE.part+'px">部分 · 点<b>33.9.1</b></span>';
  [LANE.ghost,LANE.branch,LANE.part].forEach(function(y){html+='<i class="laneLine" style="top:'+y+'px"></i>'});
  N.forEach(function(n){if(n.k==="ghost")return;var p=pos(n),pid=parentOf(n.id);if(!pid)return;var q=pos(byId[pid]);
    var grey=(byId[pid].k==="plan"||byId[pid].k==="work")&&n.k==="plan";
    if(p.y===q.y)svg+='<path class="e '+(p.y===LANE.part?'part':'seq')+(grey?' grey':'')+'" d="M'+q.x+' '+q.y+' L '+p.x+' '+p.y+'"></path>';
    else svg+='<path class="e '+(p.y<q.y?'branch':'part')+(n.k==="proposed"?' amber':'')+(grey?' grey':'')+'" d="'+S(q,p)+'"></path>';
  });
  var fx=X0+PX*3;html+='<span class="fold" style="left:'+fx+'px;top:'+LANE.seq+'px">···</span><span class="foldL" style="left:'+fx+'px;top:'+(LANE.seq-24)+'px">'+esc(FOLD.label)+'</span>';
  AUTO.forEach(function(e){var a=pos(byId[e[0]]),b=pos(byId[e[1]]),d='M'+a.x+' '+a.y+' L '+b.x+' '+b.y;
    svg+='<path class="e auto glow" d="'+d+'"></path><path class="e auto" d="'+d+'"></path>';
    if(a.y===b.y)html+='<span class="al" style="left:'+((a.x+b.x)/2)+'px;top:'+(a.y+18)+'px">'+esc(e[2])+'</span>';
    else html+='<span class="al side" style="left:'+(b.x+12)+'px;top:'+(b.y+26)+'px">'+esc(e[2])+'</span>'});
  N.forEach(function(n){var p=pos(n),lp=labelPos(n);
    html+='<button class="nd '+n.k+(n.big?' big':'')+'" style="left:'+p.x+'px;top:'+p.y+'px" aria-label="'+esc(n.id+' '+n.t)+'"></button>';
    var off={up:[0,-13],down:[0,13],right:[15,0],upleft:[-12,-12],upright:[-8,-14]}[lp];
    html+='<span class="lb '+lp+' '+n.k+(n.big?' big':'')+'" style="left:'+(p.x+off[0])+'px;top:'+(p.y+off[1])+'px"><b>'+n.id+'</b><span>'+esc(n.t)+'</span></span>';
  });
  html+='<div class="how" style="top:'+CARD_Y+'px"><b>怎么读</b>地址就是位置。<i>33.8</i> 接在 <i>33.2</i> 之后；<i>33.8a</i> 长在 33.8 旁边；<i>33.9.1</i> 是 33.9 的一部分。没有人摆放节点——地址决定位置。虚线是 Echo 从记忆里找到的关联。下面三张卡片，是三个节点背后的鲁曼卡片。</div>';
  var cx=[258,552,846];N.filter(function(n){return n.card}).forEach(function(n,i){var c=n.card,acc='';
    c.accept.forEach(function(a){acc+='<div class="a'+(a[1]?'':' open')+'"><i></i><span>'+esc(a[0])+'</span><em>'+esc(a[1]||'暂无证据')+'</em></div>'});
    html+='<div class="card '+n.k+'" style="left:'+cx[i]+'px;top:'+CARD_Y+'px"><div class="h">'+n.id+'<span>'+esc(n.t)+'</span><em>'+({approved:"已签收",work:"进行中",proposed:"提议"})[n.k]+'</em></div><div class="c">'+esc(c.claim)+'</div><div class="w">'+esc(c.why)+'</div>'+acc+'<div class="f"><img src="'+FACES[c.own]+'" alt="'+esc(c.own)+'"><b>'+esc(c.own)+'</b><span>'+esc(c.foot)+'</span></div></div>'});
  stage.innerHTML='<svg class="g" viewBox="0 0 1136 440" aria-hidden="true">'+svg+'</svg>'+html;
}

render();
})();
</script>
</body>
</html>
