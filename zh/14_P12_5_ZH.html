<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1280, initial-scale=1">
<title>Echo — Narrative · Risk</title>
<link rel="stylesheet" href="v2.css">
<style>
h1{font-size:50px}
.main{margin-top:46px;display:grid;grid-template-columns:1fr 1fr;gap:0 64px}
.hd{display:flex;align-items:baseline;gap:12px;margin-bottom:22px}
.hd small{font:600 12px var(--mono);letter-spacing:.14em;color:var(--blue-bright);opacity:.8}
.hd b{font-size:26px;font-weight:700;letter-spacing:-.025em;white-space:nowrap}
.risk .hd small{color:#ff8a7a}

/* left: why the layer holds */
.chain{position:relative;display:flex;flex-direction:column;gap:34px;margin-top:8px}
.chain::before{content:"";position:absolute;left:21px;top:22px;bottom:22px;width:2px;background:linear-gradient(180deg,rgba(174,185,245,.2),#6075ff)}
.lk{position:relative;display:flex;align-items:center;gap:16px}
.ic{width:44px;height:44px;flex:none;border-radius:12px;display:flex;align-items:center;justify-content:center;background:#0c0e17;border:1px solid rgba(160,172,255,.3)}
.ic svg{width:20px;height:20px;fill:none;stroke:#b8c1ff;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.lk p{font-size:19px;font-weight:600;letter-spacing:-.01em;line-height:1.25}
.lk p u{text-decoration:none;color:var(--muted);font-weight:500}
.lk.me .ic{border:0;border-radius:50%;background:radial-gradient(circle at 38% 32%,#dff7ff 0%,#6fd3ff 38%,#2f8dff 100%);box-shadow:0 0 22px rgba(80,160,255,.55)}
.lk.me p{color:#bfeaff}

/* right: the real risk */
.bars{position:relative;height:190px;margin-top:8px;display:flex;align-items:flex-end;gap:16px;padding:0 4px 0 0;border-bottom:1px solid var(--line-strong)}
.bar{flex:1;border-radius:8px 8px 0 0;background:linear-gradient(180deg,rgba(255,138,122,.55),rgba(255,138,122,.12));position:relative}
.bar:nth-child(n+2){background:linear-gradient(180deg,rgba(143,152,255,.6),rgba(143,152,255,.12))}
.bar i{position:absolute;left:0;right:0;bottom:-24px;text-align:center;font:600 10.5px var(--mono);font-style:normal;letter-spacing:.1em;color:var(--faint)}
.bar em{position:absolute;left:0;right:0;top:-24px;text-align:center;font-style:normal;font-size:13px;font-weight:600;color:var(--muted);white-space:nowrap}
.yl{font:600 10px var(--mono);letter-spacing:.14em;color:var(--faint);margin:-8px 0 6px}
.cap{margin-top:40px;font-size:17px;font-weight:500;color:rgba(235,238,248,.9)}
.fix{margin-top:18px;display:grid;grid-template-columns:1fr 1fr;gap:12px}
.fx{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:12px;border:1px solid rgba(160,172,255,.28);background:linear-gradient(180deg,rgba(120,135,255,.1),rgba(120,135,255,.02)),#0b0d15}
.fx .ic{width:34px;height:34px;border-radius:9px}
.fx .ic svg{width:17px;height:17px}
.fx b{display:block;font-size:14.5px;font-weight:700;line-height:1.2}
.fx div span{display:block;font-size:12.5px;color:var(--muted);white-space:nowrap}

.closer{margin-top:auto}
.src{position:absolute;left:76px;right:76px;bottom:11px;display:flex;justify-content:space-between;font:500 9.5px var(--mono);color:var(--faint);letter-spacing:.03em}
</style>
</head>
<body>
<section class="slide">
  <div class="eyebrow"><span class="dot"></span><span class="brand">ECHO</span><span>第六幕 · 风险</span></div>
  <h1>风险不在技术，<em>在销售。</em></h1>

  <div class="main">
    <div>
      <div class="hd"><small>01</small><b>技术：模型替代不了</b></div>
      <div class="chain">
        <div class="lk"><span class="ic"><svg viewBox="0 0 24 24"><path d="M6 3h9l4 4v14H6z"/><path d="M9 13l2.2 2.2L15.5 11"/></svg></span><p>企业为 agent 付钱，买的是<u>做完的活。</u></p></div>
        <div class="lk"><span class="ic"><svg viewBox="0 0 24 24"><circle cx="6" cy="6" r="2.5"/><circle cx="6" cy="18" r="2.5"/><circle cx="18" cy="12" r="2.5"/><path d="M6 8.5v7M8.3 7l7.4 3.8M8.3 17l7.4-3.8"/></svg></span><p>真实的工作<u>多变、有条件。</u></p></div>
        <div class="lk"><span class="ic"><svg viewBox="0 0 24 24"><rect x="3" y="6" width="11" height="12" rx="2"/><path d="M11 12h10M18 9l3 3-3 3"/></svg></span><p>它几乎不可能<u>在模型内部做完。</u></p></div>
        <div class="lk me"><span class="ic"></span><p>一定要有外部记忆。<u style="color:#9fdcff">这个我们来做。</u></p></div>
      </div>
    </div>

    <div class="risk">
      <div class="hd"><small>02</small><b>销售：每一单都要驻场落地</b></div>
      <div class="yl">每单成本</div>
      <div class="bars">
        <div class="bar" style="height:100%"><i>第 1 单</i></div>
        <div class="bar" style="height:72%"><i>2</i></div>
        <div class="bar" style="height:54%"><i>3</i></div>
        <div class="bar" style="height:42%"><i>4</i></div>
        <div class="bar" style="height:34%"><i>5</i></div>
        <div class="bar" style="height:28%"><i>6</i></div>
      </div>
      <div class="cap">第一单最贵，之后每一单都更便宜。</div>
      <div class="fix">
        <div class="fx"><span class="ic"><svg viewBox="0 0 24 24"><path d="M4 20V10l8-6 8 6v10z"/><path d="M9 20v-6h6v6"/></svg></span><div><b>可复用的行业 harness</b><span>每个行业做一套</span></div></div>
        <div class="fx"><span class="ic"><svg viewBox="0 0 24 24"><circle cx="8" cy="8" r="3"/><circle cx="16" cy="8" r="3"/><path d="M2 19c0-3 2.7-5 6-5s6 2 6 5M14 14c3.3 0 6 2 6 5"/></svg></span><div><b>400 万美元用来加速销售</b><span>更多工程师下到一线</span></div></div>
      </div>
    </div>
  </div>

  <div class="closer"><div class="line-copy">技术站得住，<b>400 万美元用来加速销售。</b></div></div>
  <div class="src"><span>每单成本条形图为示意</span><span>18</span></div>
</section>
</body>
</html>
